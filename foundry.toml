[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./deployments" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Isolated SmartSwapExecutorV1 certification profile. Does not change default developer/test builds.
# bytecode_hash=none + cbor_metadata=false removes IPFS compiler-input CID from creation/runtime bytecode.
# src is narrowed so unrelated repository contracts cannot enter the executor compilation unit.
[profile.smartswap_executor_release]
src = "contracts/smartswap"
out = "out-smartswap-executor-release"
cache_path = "cache-smartswap-executor-release"
libs = ["lib"]
test = "test/smartswap"
script = "script"
solc_version = "0.8.20"
auto_detect_solc = false
auto_detect_remappings = false
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
bytecode_hash = "none"
cbor_metadata = false
use_literal_content = true
sparse_mode = true
offline = false
build_info = true
extra_output = ["metadata"]
fs_permissions = [{ access = "read", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# RPC aliases — load from root .env (BNB_*_RPC_URL)
[rpc_endpoints]
bsc_testnet = "${BNB_TESTNET_RPC_URL}"
bsc_mainnet = "${BNB_MAINNET_RPC_URL}"

# BscScan verification — key from BSCSCAN_API_KEY or BSCSCAN_API_KEY
[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api", chain = 56 }
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api", chain = 97 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
