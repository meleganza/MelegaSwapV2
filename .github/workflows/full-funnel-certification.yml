name: Full Funnel Deterministic Certification

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/full-funnel-certification.yml'

permissions:
  contents: read

concurrency:
  group: full-funnel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16.18.0
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:certification
