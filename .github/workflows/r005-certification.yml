name: R005 isolated certification
on:
  push:
    branches: ['cert/r005-20261015']
  pull_request:
    paths: ['apps/next-gen/**', '.github/workflows/r005-certification.yml']
permissions:
  contents: read
jobs:
  next-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Mock wallet duplicate regression
        run: |
          npm install --prefix "$RUNNER_TEMP/r005-mock" --ignore-scripts --legacy-peer-deps react-test-renderer@18.2.0
          ln -s "$GITHUB_WORKSPACE/node_modules/react" "$RUNNER_TEMP/r005-mock/node_modules/react"
          NODE_PATH="$RUNNER_TEMP/r005-mock/node_modules" node --import tsx docs/stability/r005-certification/click-cert.tsx
      - name: Unit tests
        run: yarn workspace @melega/next-gen test
      - name: Typecheck
        if: success() || failure()
        run: yarn workspace @melega/next-gen typecheck
      - name: Build
        if: success() || failure()
        run: yarn workspace @melega/next-gen build
      - name: Home budget
        if: success() || failure()
        run: yarn workspace @melega/next-gen budget
      - name: Responsive Home and zero idle RPC
        if: success()
        run: |
          yarn workspace @melega/next-gen start > "$RUNNER_TEMP/r005-next.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4317/ >/dev/null && break || sleep 1; done
          CHROME_PATH="$(command -v google-chrome)" BETA_SCREENSHOT_DIR="$RUNNER_TEMP/r005-shots" node apps/next-gen/scripts/responsive-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r005-responsive-evidence
          path: ${{ runner.temp }}/r005-shots
